# Unused network protocols, blocked per Lynis NETW-3200.
# Loading one runs /usr/local/bin/blocked-module instead: it refuses, logs and
# shows a desktop notification. To allow one again, delete its line (no reboot needed).
install dccp /usr/local/bin/blocked-module dccp
install sctp /usr/local/bin/blocked-module sctp
install rds  /usr/local/bin/blocked-module rds
install tipc /usr/local/bin/blocked-module tipc
