# Kernel hardening: 7 of the Lynis KRNL-6000 suggestions (see docs/06-kernel-hardening.md).
# Sorts after 99-omarchy-sysctl.conf so these values win. Undo: delete this file and reboot.
kernel.kptr_restrict = 2
net.core.bpf_jit_harden = 2
dev.tty.ldisc_autoload = 0
fs.protected_fifos = 2
fs.protected_regular = 2
# Overrides systemd's 50-coredump.conf (2); normal programs still dump core
fs.suid_dumpable = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
